name: Notification API Deploy - DEV

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DOTNET_VERSION: '10.0.303'
  BUILD_CONFIGURATION: 'Release'
  SOLUTION_FILE: 'TexasMediaDart.Notification.slnx'
  API_PROJECT: 'src/TexasMediaDart.Notification.Api/TexasMediaDart.Notification.Api.csproj'
  API_PUBLISH_PATH: '${{ github.workspace }}/publish'
  AZURE_WEBAPP_NAME: 'texasmediadart-notification-api-dev'

jobs:

  build:
    name: Build Notification API Release
    runs-on: ubuntu-latest

    outputs:
      build_version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Generate build version
        id: version
        shell: bash
        run: |
          DATE=$(date +'%Y.%m.%d')
          BUILD=$(printf "%04d" "${{ github.run_number }}")
          VERSION="$DATE.$BUILD"

          echo "BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Notification API Release Version: $VERSION"

          echo "### Notification API Release Version" >> "$GITHUB_STEP_SUMMARY"
          echo "**$VERSION**" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore solution
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build solution
        run: >
          dotnet build
          ${{ env.SOLUTION_FILE }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-restore

      - name: Publish Notification API
        run: >
          dotnet publish
          ${{ env.API_PROJECT }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-restore
          --output ${{ env.API_PUBLISH_PATH }}
          /p:InformationalVersion=${{ env.BUILD_VERSION }}
          /p:IncludeSourceRevisionInInformationalVersion=false

      - name: Create versioned API package
        shell: bash
        run: |
          mkdir -p artifacts

          PACKAGE="artifacts/TexasMediaDart.Notification.Api-${BUILD_VERSION}.zip"

          cd "${{ env.API_PUBLISH_PATH }}"
          zip -r "${{ github.workspace }}/$PACKAGE" .

          echo "Notification API package created:"
          echo "$PACKAGE"

      - name: Upload Notification API artifact
        uses: actions/upload-artifact@v4
        with:
          name: TexasMediaDart.Notification.Api-${{ env.BUILD_VERSION }}
          path: artifacts/TexasMediaDart.Notification.Api-${{ env.BUILD_VERSION }}.zip
          if-no-files-found: error
          retention-days: 30

  deploy-api-dev:
    name: Deploy Notification API to DEV
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:
      - name: Display version
        run: |
          echo "Deploying Notification API Version:"
          echo "${{ needs.build.outputs.build_version }}"

      - name: Download Notification API artifact
        uses: actions/download-artifact@v4
        with:
          name: TexasMediaDart.Notification.Api-${{ needs.build.outputs.build_version }}
          path: artifacts

      - name: Verify API package
        shell: bash
        run: |
          PACKAGE="artifacts/TexasMediaDart.Notification.Api-${{ needs.build.outputs.build_version }}.zip"

          if [ ! -f "$PACKAGE" ]; then
            echo "Notification API package was not found:"
            echo "$PACKAGE"
            exit 1
          fi

          echo "Notification API package:"
          echo "$PACKAGE"

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate DEV configuration
        shell: bash
        env:
          NOTIFICATION_SERVICE_API_KEY: ${{ secrets.NOTIFICATION_SERVICE_API_KEY }}
          EMAIL_CONNECTION_STRING: ${{ secrets.AZURE_COMMUNICATION_EMAIL_CONNECTION_STRING }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
          EMAIL_SENDER_ADDRESS: ${{ vars.EMAIL_SENDER_ADDRESS }}
          EMAIL_SENDER_DISPLAY_NAME: ${{ vars.EMAIL_SENDER_DISPLAY_NAME }}
          FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL }}
        run: |
          if [ -z "$NOTIFICATION_SERVICE_API_KEY" ]; then
            echo "ERROR: NOTIFICATION_SERVICE_API_KEY is missing or empty."
            exit 1
          fi

          if [ -z "$EMAIL_CONNECTION_STRING" ]; then
            echo "ERROR: AZURE_COMMUNICATION_EMAIL_CONNECTION_STRING is missing or empty."
            exit 1
          fi

          if [ -z "$EMAIL_PROVIDER" ]; then
            echo "ERROR: EMAIL_PROVIDER is missing or empty."
            exit 1
          fi

          if [ -z "$EMAIL_SENDER_ADDRESS" ]; then
            echo "ERROR: EMAIL_SENDER_ADDRESS is missing or empty."
            exit 1
          fi

          if [ -z "$EMAIL_SENDER_DISPLAY_NAME" ]; then
            echo "ERROR: EMAIL_SENDER_DISPLAY_NAME is missing or empty."
            exit 1
          fi

          if [ -z "$FRONTEND_BASE_URL" ]; then
            echo "ERROR: FRONTEND_BASE_URL is missing or empty."
            exit 1
          fi

          echo "Notification DEV configuration is available."

      - name: Configure DEV application settings
        shell: bash
        env:
          NOTIFICATION_SERVICE_API_KEY: ${{ secrets.NOTIFICATION_SERVICE_API_KEY }}
          EMAIL_CONNECTION_STRING: ${{ secrets.AZURE_COMMUNICATION_EMAIL_CONNECTION_STRING }}
        run: |
          az webapp config appsettings set \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "TexasMediaDart-Dev" \
            --settings \
              "ServiceAuthentication__ApiKey=$NOTIFICATION_SERVICE_API_KEY" \
              "Email__Provider=${{ vars.EMAIL_PROVIDER }}" \
              "Email__ConnectionString=$EMAIL_CONNECTION_STRING" \
              "Email__SenderAddress=${{ vars.EMAIL_SENDER_ADDRESS }}" \
              "Email__SenderDisplayName=${{ vars.EMAIL_SENDER_DISPLAY_NAME }}" \
              "Email__FrontendBaseUrl=${{ vars.FRONTEND_BASE_URL }}"

      - name: Verify DEV application settings
        shell: bash
        run: |
          REQUIRED_SETTINGS=(
            "ServiceAuthentication__ApiKey"
            "Email__Provider"
            "Email__ConnectionString"
            "Email__SenderAddress"
            "Email__SenderDisplayName"
            "Email__FrontendBaseUrl"
          )

          for SETTING in "${REQUIRED_SETTINGS[@]}"; do
            SETTING_EXISTS=$(az webapp config appsettings list \
              --name "${{ env.AZURE_WEBAPP_NAME }}" \
              --resource-group "TexasMediaDart-Dev" \
              --query "[?name=='$SETTING'].name | [0]" \
              --output tsv)

            if [ "$SETTING_EXISTS" != "$SETTING" ]; then
              echo "ERROR: $SETTING was not created in Azure App Service."
              exit 1
            fi

            echo "$SETTING exists."
          done

      - name: Deploy Notification API to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: artifacts/TexasMediaDart.Notification.Api-${{ needs.build.outputs.build_version }}.zip

      - name: Verify Notification API health
        shell: bash
        run: |
          HEALTH_URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health/api"

          echo "Checking:"
          echo "$HEALTH_URL"

          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$HEALTH_URL"; then
              echo ""
              echo "Notification API is healthy."
              exit 0
            fi

            echo "Health check attempt $attempt failed. Waiting 10 seconds..."
            sleep 10
          done

          echo "ERROR: Notification API health check failed."
          exit 1